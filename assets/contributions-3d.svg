<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title"><title id="title">3D contribution history</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020617"/><stop offset="1" stop-color="#0B1120"/></linearGradient><linearGradient id="edge"><stop stop-color="#00E5FF"/><stop offset="1" stop-color="#A855F7"/></linearGradient><radialGradient id="halo"><stop stop-color="#2563EB" stop-opacity=".34"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1E293B" stroke-opacity=".45"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="150" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="148" rx="18" fill="url(#grid)" stroke="#1E293B"/><rect x="2" y="2" width="1196" height="146" rx="17" fill="none" stroke="url(#edge)" stroke-dasharray="100 2400" stroke-width="2"><animate attributeName="stroke-dashoffset" from="0" to="-2500" dur="14s" repeatCount="indefinite"/></rect><text x="40" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#F8FAFC" text-anchor="start">3D contribution history</text><text x="40" y="100" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#94A3B8" text-anchor="start">Awaiting first successful GitHub Actions run — no activity data shown.</text></svg>