rial,sans-serif" font-size="18" font-weight="400" fill="#F8FAFC" text-anchor="start">ChromaDB • Embeddings • Semantic search</text><text x="630" y="333" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#F8FAFC" text-anchor="start">MMR • Vector retrieval • Document processing</text><rect x="40" y="369" width="550" height="96" rx="12" fill="#111827" stroke="#1E293B"/><circle cx="60" cy="389" r="4" fill="#00E5FF"><animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/></circle><text x="74" y="395" font-family="monospace" font-size="17" font-weight="700" fill="#00E5FF" text-anchor="start">BACKEND</text><text x="60" y="423" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#F8FAFC" text-anchor="start">FastAPI • Streamlit • MySQL</text><rect x="610" y="369" width="550" height="96" rx="12" fill="#111827" stroke="#1E293B"/><circle cx="630" cy="389" r="4" fill="#A855F7"><animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/></circle><text x="644" y="395" font-family="monospace" font-size="17" font-weight="700" fill="#00E5FF" text-anchor="start">DATA SCIENCE</text><text x="630" y="423" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#F8FAFC" text-anchor="start">Pandas • NumPy • Matplotlib • Seaborn</text><text x="630" y="445" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#F8FAFC" text-anchor="start">Statistics • EDA • Preprocessing</text><rect x="40" y="481" width="550" height="96" rx="12" fill="#111827" stroke="#1E293B"/><circle cx="60" cy="501" r="4" fill="#00E5FF"><animate attributeName="opacity" values=".5;1;.5" dur="3s" repeatCount="indefinite"/></circle><text x="74" y="507" font-family="monospace" font-size="17" font-weight="700" fill="#00E5FF" text-anchor="start">MLOPS &amp; TOOLS</text><text x="60" y="535" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#F8FAFC" text-anchor="start">Docker • Git • GitHub